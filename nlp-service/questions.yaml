questions_by_role:
  backend_developer:
    - id: "b1"
      text: "What is the difference between monolithic and microservices architecture?"
      ideal_answer: "Monolithic architecture is a single codebase for all functionality, while microservices split functionality into independent services that communicate via APIs."
    - id: "b2"
      text: "How does garbage collection work in .NET?"
      ideal_answer: "Garbage collection in .NET automatically reclaims memory used by objects no longer in use, using generations and background threads."
    - id: "b3"
      text: "What are the SOLID principles?"
      ideal_answer: "SOLID stands for five principles: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, and Dependency Inversion — they guide clean, maintainable OOP design."
    - id: "b4"
      text: "Explain dependency injection and its advantages."
      ideal_answer: "Dependency injection is a pattern where objects receive their dependencies from external sources. It improves testability and decouples components."

  frontend_developer:
    - id: "f1"
      text: "Explain the virtual DOM in React."
      ideal_answer: "The virtual DOM is a lightweight in-memory representation of the real DOM. React updates it first and efficiently syncs changes to the real DOM."
    - id: "f2"
      text: "What is the difference between controlled and uncontrolled components?"
      ideal_answer: "Controlled components are managed via React state, while uncontrolled components manage their state using the DOM directly."
    - id: "f3"
      text: "Describe the lifecycle methods in React."
      ideal_answer: "Lifecycle methods include mounting (`componentDidMount`), updating (`shouldComponentUpdate`), and unmounting (`componentWillUnmount`). In hooks, `useEffect` handles these."
    - id: "f4"
      text: "What is the role of keys in React lists?"
      ideal_answer: "Keys help React identify which items changed, added, or removed, improving rendering performance and maintaining component identity."

  data_scientist:
    - id: "d1"
      text: "What is the difference between supervised and unsupervised learning?"
      ideal_answer: "Supervised learning uses labeled data to train models, while unsupervised learning works with unlabeled data to find patterns or clusters."
    - id: "d2"
      text: "How does a random forest algorithm work?"
      ideal_answer: "Random Forest is an ensemble method that builds multiple decision trees and merges their outputs to improve accuracy and reduce overfitting."
    - id: "d3"
      text: "Explain precision, recall, and F1 score."
      ideal_answer: "Precision is true positives over predicted positives, recall is true positives over actual positives, and F1 score is the harmonic mean of both."
    - id: "d4"
      text: "What is cross-validation in machine learning?"
      ideal_answer: "Cross-validation splits data into subsets to train and test models multiple times, reducing overfitting and ensuring model generalization."
